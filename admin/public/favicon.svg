<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Obsidian Squircle Base Gradient -->
    <linearGradient id="bgGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15151A" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Technical Sheet Surface Gradient -->
    <linearGradient id="sheetGrad" x1="15" y1="11" x2="49" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22222A" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>

    <!-- Electric Amber Corner Fold & Accent Gradient -->
    <linearGradient id="amberGrad" x1="35" y1="11" x2="49" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD066" />
      <stop offset="45%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Subtle Ambient Glow Behind Sheet -->
    <radialGradient id="amberGlow" cx="38" cy="20" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Double-Bezel Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" stroke="#FF9F0A" stroke-opacity="0.14" stroke-width="1" />

  <!-- Ambient Top-Right Amber Glow -->
  <circle cx="38" cy="20" r="22" fill="url(#amberGlow)" />

  <!-- Technical Note Sheet Body with Folded Top-Right Cutout -->
  <path
    d="M20 11H35.5L49 24.5V48C49 50.7614 46.7614 53 44 53H20C17.2386 53 15 50.7614 15 48V16C15 13.2386 17.2386 11 20 11Z"
    fill="url(#sheetGrad)"
    stroke="#FFFFFF"
    stroke-opacity="0.18"
    stroke-width="1.75"
    stroke-linejoin="round"
  />

  <!-- Typography / Note Lines Inside Sheet -->
  <line x1="21.5" y1="24" x2="30.5" y2="24" stroke="#EDEDED" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="21.5" y1="32.5" x2="41.5" y2="32.5" stroke="#EDEDED" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="21.5" y1="41" x2="29.5" y2="41" stroke="#EDEDED" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.55" />

  <!-- Calculation / Reactive "=" & ".do" Amber Indicator on Bottom Right of Sheet -->
  <line x1="35" y1="39.2" x2="42.5" y2="39.2" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" />
  <line x1="35" y1="43.2" x2="42.5" y2="43.2" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" />

  <!-- Folded Corner Flap in Electric Amber (#FF9F0A) -->
  <path
    d="M35.5 11L49 24.5H40C37.5147 24.5 35.5 22.4853 35.5 20V11Z"
    fill="url(#amberGrad)"
  />
  <path
    d="M35.5 11L49 24.5H40C37.5147 24.5 35.5 22.4853 35.5 20V11Z"
    stroke="#FFE5A3"
    stroke-opacity="0.45"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>
